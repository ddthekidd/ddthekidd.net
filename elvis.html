<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Stretches/crops video to fill every pixel of the screen */
      display: block;
    }
  </style>
</head>
<body>

  <video autoplay loop muted playsinline>
    <source src="assets/video.mp4" type="video/mp4">
  </video>

</body>
</html>
